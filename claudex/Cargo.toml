[package]
name = "claude-codex-server"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Codex app-server protocol facade and desktop router"
publish = false
autobins = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider"] }
# Enable the relay's provider without activating reqwest's ring default.
rustls.workspace = true
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3"
