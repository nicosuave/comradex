name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${tag_version}" = "${manifest_version}"
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact="comradex-${version}-macos-${{ matrix.arch }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "${artifact}" comradex
          shasum -a 256 "${artifact}" > "${artifact}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: comradex-macos-${{ matrix.arch }}
          path: |
            comradex-*.tar.gz
            comradex-*.sha256

  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${tag_version}" = "${manifest_version}"
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact="comradex-${version}-linux-${{ matrix.arch }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "${artifact}" comradex
          sha256sum "${artifact}" > "${artifact}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: comradex-linux-${{ matrix.arch }}
          path: |
            comradex-*.tar.gz
            comradex-*.sha256

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

  update-homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger homebrew-tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh api --method POST repos/nicosuave/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -F "client_payload[formula]=comradex" \
            -F "client_payload[version]=${version}" \
            -F "client_payload[repo]=nicosuave/comradex"
