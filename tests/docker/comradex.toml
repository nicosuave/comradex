[proxy]
upstream = "https://chatgpt.com/backend-api/codex"
switch_at = 80
max_inflight = 16
max_upgrades = 8
state_dir = "/tmp/comradex-state"
installation_secret = "docker-test-route-secret"
affinity_key = "docker-test-affinity-key-32-bytes-minimum"

[listeners.default]
address = "0.0.0.0:10100"
pool = "default"

# Downstream client URL shapes served behind the installation secret (see README
# "Connecting Codex"). Both stay working; no daemon change is needed to cut over.
#   Codex 0.153+ with context_management experimental_mode:
#     openai_base_url = "http://0.0.0.0:10100/docker-test-route-secret/backend-api/codex"
#   Older clients:
#     openai_base_url = "http://0.0.0.0:10100/docker-test-route-secret/v1"

[pools.default]
members = ["caller"]

[accounts.caller]
kind = "inbound"
