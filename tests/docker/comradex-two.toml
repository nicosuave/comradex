[proxy]
upstream = "https://chatgpt.com/backend-api/codex"
switch_at = 80
max_inflight = 16
max_upgrades = 8
state_dir = "/tmp/comradex-state"
installation_secret = "docker-two-account-secret"
affinity_key = "docker-two-account-affinity-key-32-bytes"

[listeners.default]
address = "0.0.0.0:10100"
pool = "default"

# Downstream client URL shapes served behind the installation secret (see README
# "Connecting Codex"). Both stay working; no daemon change is needed to cut over.
#   Codex 0.153+ with context_management experimental_mode:
#     openai_base_url = "http://0.0.0.0:10100/docker-two-account-secret/backend-api/codex"
#   Older clients:
#     openai_base_url = "http://0.0.0.0:10100/docker-two-account-secret/v1"

[listeners.reverse]
address = "0.0.0.0:10101"
pool = "reverse"

[pools.default]
members = ["account_a", "account_b"]

[pools.reverse]
members = ["account_b", "account_a"]

[accounts.account_a]
kind = "codex_home"
path = "/accounts/a"

[accounts.account_b]
kind = "codex_home"
path = "/accounts/b"
